<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photobooth Page</title>
    <style>
        html {
            background: linear-gradient(to bottom, #7DDCFF, #FFFFFF);
            }
            .photo-preview-container{
                display: flex;
                flex-direction: row;
            }
            .captured-Photo-container{
                display: flex;
                flex-direction: column;
            }
            .video-cam-container{
                position: relative;
                left: 6rem;
            }
            .video-cam-container h3{
                font-size: 40px;
                font-family: Arial, Helvetica, sans-serif;
                margin-bottom: 0;
            }
            .video-cam-container video {
                border-radius: 20px;
                border: #000000 solid 3px;
                max-width: 700px;
            }

            .download-btn-container{
                position: relative;
                top: 2rem;
                left: 100px;
            }

            .download-btn-container button {
                background-color: #37A2FF;
                font-size: 20px;
                border-radius: 50px;
                padding: 10px;
            }

            .captured-Photo-container {
                position: relative;
                padding: 10px;
                left: 230px;
                top: 85px;
            }
            button:hover {
                background-color: #09487f;
            }
            video {
                transform: scaleX(1);
            }

            @media (max-width: 768px) {
                html {
                    background: linear-gradient(to bottom, #A4E8FF, #FFFFFF);
                }

                .photo-preview-container {
                    flex-direction: column;
                    align-items: center;
                    justify-content: center;
                }

                .video-cam-container {
                    left: 0;
                    text-align: center;
                    max-width: 350px;
                    height: 250px;
                }

                .video-cam-container h3 {
                    font-size: 28px;
                }

                .video-cam-container video {
                    max-width: 350px;
                    height: 250px;
                }

                .captured-Photo-container {
                    left: 0;
                    right: 0;
                    top: 20px;
                    flex-direction: row;
                    justify-content: center;
                    gap: 10px;
                    padding: 10px 0;
                    overflow-x: auto;       
                    overflow-y: hidden;    
                    scroll-behavior: smooth;
                    white-space: nowrap;    
                    width: 100%;
                    box-sizing: border-box;
                }

                .captured-Photo-container img {
                    width: 90px;
                    margin: 5px;
                }

                .download-btn-container {
                    left: 0;
                    text-align: center;
                    top: 3rem;
                }

                .download-btn-container button {
                    font-size: 16px;
                    padding: 8px 16px;
                    border-radius: 30px;
                    margin: 10px;
                }
            }

    </style>
</head>
<body>
    <div class="main-container">
        <div class="photo-preview-container">
            
            <div class="video-cam-container">
                <h3 class="top-label">Navi Pixels</h3>
                <video id="video" autoplay playsinline></video>
            </div>


            <div class="captured-Photo-container" id="capturedPhotoContainer">
                
            </div>
        </div>

        <div class="download-btn-container">
        <button type="button" id="captureButton">Capture <svg width="20" height="20" viewBox="0 0 10 8" fill="none" xmlns="http://www.w3.org/2000/svg">

        </svg></button>

        <button id="retakePicturesButton">Re-take <svg width="20" height="20" viewBox="0 0 20 18" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M18 2H14.83L13 0H7L5.17 2H2C1.46957 2 0.960859 2.21071 0.585786 2.58579C0.210714 2.96086 0 3.46957 0 4V16C0 16.5304 0.210714 17.0391 0.585786 17.4142C0.960859 17.7893 1.46957 18 2 18H18C18.5304 18 19.0391 17.7893 19.4142 17.4142C19.7893 17.0391 20 16.5304 20 16V4C20 3.46957 19.7893 2.96086 19.4142 2.58579C19.0391 2.21071 18.5304 2 18 2ZM18 16H2V4H6.05L7.88 2H12.12L14 4H18V16ZM10 15C8.92 15 7.86 14.65 7 14L8.44 12.56C8.91 12.85 9.45 13 10 13C10.7956 13 11.5587 12.6839 12.1213 12.1213C12.6839 11.5587 13 10.7956 13 10C13 9.20435 12.6839 8.44129 12.1213 7.87868C11.5587 7.31607 10.7956 7 10 7C8.74 7 7.6 7.8 7.18 9H9L6 12L3 9H5.1C5.23084 8.35627 5.48731 7.74466 5.85475 7.20015C6.22219 6.65564 6.69338 6.18892 7.24137 5.82669C7.78936 5.46446 8.40339 5.21382 9.04834 5.08913C9.69328 4.96444 10.3565 4.96813 11 5.1C12.2152 5.34674 13.2953 6.0362 14.0307 7.03453C14.7661 8.03285 15.1043 9.26882 14.9797 10.5025C14.8551 11.7362 14.2765 12.8795 13.3563 13.7106C12.4361 14.5417 11.24 15.0012 10 15Z" fill="black"/>
        </svg>
        </button>

        <button id="downloadButton">Download Photobooth <svg width="20" height="20" viewBox="0 0 18 22" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M5 3V5H2V18H16V5H13V3H16C16.5304 3 17.0391 3.21071 17.4142 3.58579C17.7893 3.96086 18 4.46957 18 5V18C18 18.5304 17.7893 19.0391 17.4142 19.4142C17.0391 19.7893 16.5304 20 16 20H2C1.46957 20 0.960859 19.7893 0.585786 19.4142C0.210714 19.0391 0 18.5304 0 18V5C0 4.46957 0.210714 3.96086 0.585786 3.58579C0.960859 3.21071 1.46957 3 2 3H5ZM9 0C9.26522 0 9.51957 0.105357 9.70711 0.292893C9.89464 0.48043 10 0.734784 10 1V11.828L11.828 10C11.9208 9.90709 12.0311 9.83338 12.1524 9.78307C12.2737 9.73276 12.4038 9.70684 12.5351 9.7068C12.6665 9.70675 12.7966 9.73258 12.9179 9.7828C13.0393 9.83302 13.1496 9.90666 13.2425 9.9995C13.3354 10.0923 13.4091 10.2026 13.4594 10.3239C13.5097 10.4452 13.5357 10.5753 13.5357 10.7066C13.5357 10.838 13.5099 10.9681 13.4597 11.0894C13.4095 11.2108 13.3358 11.3211 13.243 11.414L9.883 14.773C9.64861 15.0072 9.33083 15.1387 8.9995 15.1387C8.66817 15.1387 8.35039 15.0072 8.116 14.773L4.757 11.414C4.66416 11.3211 4.59052 11.2108 4.5403 11.0894C4.49008 10.9681 4.46425 10.838 4.4643 10.7066C4.46434 10.5753 4.49026 10.4452 4.54057 10.3239C4.59088 10.2026 4.66459 10.0923 4.7575 9.9995C4.85041 9.90666 4.9607 9.83302 5.08207 9.7828C5.20343 9.73258 5.3335 9.70675 5.46485 9.7068C5.5962 9.70684 5.72626 9.73276 5.84759 9.78307C5.96892 9.83338 6.07916 9.90709 6.172 10L8 11.828V1C8 0.734784 8.10536 0.48043 8.29289 0.292893C8.48043 0.105357 8.73478 0 9 0Z" fill="black"/>
        </svg></button>
        </div>
    </div>
    
    <script>
            const video = document.getElementById('video');
            const captureButton = document.getElementById('captureButton');
            const capturedPhotoContainer = document.getElementById('capturedPhotoContainer');
            const downloadButton = document.getElementById('downloadButton');
            const retakePicturesButton = document.getElementById('retakePicturesButton');

            const photosArray = [];
            let photoCount = 0;

            document.addEventListener('DOMContentLoaded', async () => {
                captureButton.addEventListener('click', takePhoto)
                downloadButton.addEventListener('click', downloadPhotos);
                openCamera();
            })


            async function openCamera() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    video.srcObject = stream;
                } catch (err) {
                    console.error("Camera error:", err);
                    alert("Could not access camera. Make sure you allow permissions.");
                }

                retakePicturesButton.addEventListener('click', () => {
                    window.location.reload(true);
                })
            }


            async function takePhoto () {
            if (photoCount >= 4) {
                captureButton.disabled = true;
                return;
            }

            captureButton.disabled = true; 

            const countdownElement = document.createElement('div');
            countdownElement.style.position = 'absolute';
            countdownElement.style.top = '50%';
            countdownElement.style.left = '50%';
            countdownElement.style.transform = 'translate(-50%, -50%)';
            countdownElement.style.fontSize = '80px';
            countdownElement.style.fontWeight = 'bold';
            countdownElement.style.color = 'white';
            countdownElement.style.textShadow = '0 0 15px black';
            countdownElement.style.zIndex = '999';
            document.body.appendChild(countdownElement);

            const takeSinglePhoto = async () => {
                if (photoCount >= 4) {
                captureButton.disabled = true;
                countdownElement.remove();
                return;
                }

                for (let i = 3; i > 0; i--) {
                countdownElement.textContent = i;
                await new Promise((r) => setTimeout(r, 1000));
                }

                countdownElement.textContent = ""; 

                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;

                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                const photoData = canvas.toDataURL('image/png');

                photosArray.push(photoData);
                photoCount++;

                console.log(`Photo ${photoCount} captured!`, photosArray);

                const img = document.createElement('img');
                img.src = photoData;
                img.style.width = '150px';
                img.style.margin = '5px';
                capturedPhotoContainer.appendChild(img);
            };


            for (let i = photoCount; i < 4; i++) {
                await takeSinglePhoto();
                await new Promise((r) => setTimeout(r, 1000)); 
            }

            countdownElement.remove();
            captureButton.disabled = true;
            }


            async function downloadPhotos() {
            if (photosArray.length === 0) {
                alert("No photos to download!");
                return;
            }

            const singleWidth = 300;   
            const singleHeight = 225;  
            const border = 10;         
            const textHeight = 60;    

            const canvas = document.createElement('canvas');
            canvas.width = singleWidth + border * 2;
            canvas.height = singleHeight * photosArray.length + border * (photosArray.length + 1) + textHeight;

            const ctx = canvas.getContext('2d');

            ctx.fillStyle = "#aadef2";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < photosArray.length; i++) {
                const img = new Image();
                img.src = photosArray[i];

                await new Promise((resolve) => {
                img.onload = () => {
                    const x = border;
                    const y = border + i * (singleHeight + border);
                    ctx.drawImage(img, x, y, singleWidth, singleHeight);
                    resolve();
                };
                });
            }

            ctx.fillStyle = "#000";
            ctx.font = "bold 32px Arial";
            ctx.textAlign = "center";
            ctx.fillText("Navi Pixels", canvas.width / 2, canvas.height - textHeight / 3);

            const finalImage = canvas.toDataURL('image/png');
            const link = document.createElement('a');
            link.href = finalImage;
            link.download = 'photobooth-strip.png';
            link.click();
            }
    </script>
</body>
</html>
